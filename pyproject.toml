[project]
name = "absengine"
version = "0.1.0"
description = "ABS challenge decision engine: when should a player challenge a called pitch?"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandera[polars]>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "typer>=0.12",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pymc>=5.16",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
app = ["streamlit>=1.38", "plotly>=5.24"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.112",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
absengine = "absengine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/absengine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "NPY"]
ignore = [
    "N803", "N806", "N812", "N817",  # math-style names; short module aliases (R, W, G)
    "PTH207",  # absolute glob patterns from config
]

[tool.ruff.lint.per-file-ignores]
"src/absengine/contracts/*" = ["RUF012"]  # pandera Config uses class-level lists

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "pymc.*", "arviz.*", "sklearn.*", "scipy.*", "pyarrow.*", "duckdb.*", "matplotlib.*", "streamlit.*", "plotly.*", "pandera.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=absengine --cov-report=term-missing:skip-covered"
markers = ["slow: needs real data or long runtime"]

[tool.coverage.run]
omit = ["src/absengine/cli.py"]
